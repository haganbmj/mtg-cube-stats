name: Deploy Github Pages

on:
  push:
    branches:
      - main
  schedule:
    - cron: "0 13 * * *" # Daily at 13:00 UTC; Update preloads.
    - cron: "0 9 * * 1"  # Weekly on Monday at 09:00 UTC; Update Scryfall data.
    - cron: "0 9 1 * *"  # Monthly on the 1st at 09:00 UTC; Update CubeCobra card stats.
  workflow_dispatch:
    inputs:
      refresh_scryfall:
        description: "Refresh Scryfall card data"
        type: boolean
        default: false
      refresh_preloads:
        description: "Refresh cube preloads from CubeCobra"
        type: boolean
        default: false
      refresh_cobra_cards:
        description: "Refresh CubeCobra card stats"
        type: boolean
        default: false

concurrency:
  group: "pages"
  cancel-in-progress: false

env:
  REFRESH_SCRYFALL: ${{ (github.event_name == 'schedule' && github.event.schedule == '0 9 * * 1') || (github.event_name == 'workflow_dispatch' && inputs.refresh_scryfall) }}
  REFRESH_PRELOADS: ${{ (github.event_name == 'schedule' && github.event.schedule == '0 13 * * *') || (github.event_name == 'workflow_dispatch' && inputs.refresh_preloads) }}
  REFRESH_COBRA_CARDS: ${{ (github.event_name == 'schedule' && github.event.schedule == '0 9 1 * *') || (github.event_name == 'workflow_dispatch' && inputs.refresh_cobra_cards) }}

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v6.4.0
        with:
          node-version: "24.x"

      - name: Cache dependencies
        uses: actions/cache@v5.0.5
        with:
          path: ~/.npm
          key: ${{ runner.os }}-node-${{ hashFiles('**/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-node-
      - name: Restore Cached Preloads
        uses: actions/cache/restore@v5.0.5
        with:
          path: |
            preloads/cache/
            preloads/generated/
          key: cube-preloads-${{ github.run_id }}
          restore-keys: |
            cube-preloads-
      - name: Restore Cached Card List
        uses: actions/cache/restore@v5.0.5
        with:
          path: |
            data/default-cards.json
            data/flavor-words.json
            data/sets.json
            data/tagger-data.json
            data/cubecobra-card-stats.json
          key: scryfall-json-${{ github.run_id }}
          restore-keys: |
            scryfall-json-

      - run: echo "VITE_BUILD_SHA=$GITHUB_SHA" >> $GITHUB_ENV
      - run: npm ci
      - run: npm run cards
      - run: npm run cobra-cards
      - run: npm run preload
      - run: VITE_BUILD_SHA=$GITHUB_SHA npm run build

      - name: Upload Pages Artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: ./dist

      - name: Save Cached Card List
        uses: actions/cache/save@v5.0.5
        with:
          path: |
            data/default-cards.json
            data/flavor-words.json
            data/sets.json
            data/tagger-data.json
            data/cubecobra-card-stats.json
          key: scryfall-json-${{ github.run_id }}
      - name: Save Cached Preloads
        uses: actions/cache/save@v5.0.5
        with:
          path: |
            preloads/cache/
            preloads/generated/
          key: cube-preloads-${{ github.run_id }}

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to Github Pages
        id: deployment
        uses: actions/deploy-pages@v5
