name: Pull Request Validation

on: pull_request

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v6.1.0
        with:
          node-version: "22.x"

      - name: Cache dependencies
        uses: actions/cache@v4.3.0
        with:
          path: ~/.npm
          key: ${{ runner.os }}-node-${{ hashFiles('**/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-node-
      - name: Restore Cached Preloads
        uses: actions/cache/restore@v4.3.0
        with:
          path: |
            preloads/
          key: cube-preloads-${{ github.run_id }}
          restore-keys: |
            cube-preloads-
      - name: Restore Cache Card List
        uses: actions/cache/restore@v4.3.0
        with:
          path: |
            data/default-cards.json
            data/flavor-words.json
            data/tagger-data.json
          key: scryfall-json-${{ github.run_id }}
          restore-keys: |
            scryfall-json-

      - run: echo "VITE_BUILD_SHA=$GITHUB_SHA" >> $GITHUB_ENV
      - run: npm ci
      - run: npm run cards
      - run: VITE_BUILD_SHA=$GITHUB_SHA npm run build
